[project]
name = "veilleur-vm-source"
version = "0.1.0"
description = "Collector used by the NixOS tests: the HTTP client refuses local addresses, so it reads a file."
license = "EUPL-1.2"
requires-python = ">=3.12"

[project.entry-points."veilleur.collectors"]
vm_source = "veilleur_vm_source:VmSourceCollector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veilleur_vm_source"]
