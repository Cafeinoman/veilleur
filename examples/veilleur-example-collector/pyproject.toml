[project]
name = "veilleur-example-collector"
version = "0.1.0"
description = "Example collector plugin for Veilleur: one item per line of a text file."
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = ["veilleur"]

[project.entry-points."veilleur.collectors"]
text_lines = "veilleur_example_collector:TextLinesCollector"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veilleur_example_collector"]
