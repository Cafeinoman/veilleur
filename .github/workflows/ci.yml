# SPDX-License-Identifier: EUPL-1.2
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Tests (including translation catalogues, licence headers, bilingual documentation)
        run: uv run --locked pytest
      - name: Protocol test vectors (independent implementation, libsodium)
        run: uv run --locked python tools/check_vectors.py
      - name: Lint
        run: uv run --locked ruff check src tests tools protocol receiver
      - name: Types
        run: uv run --locked mypy
      - name: Architecture
        run: uv run --locked lint-imports

  just-test:
    name: just test (nix develop)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # The NixOS tests of tests/verif evaluate the modules with `--offline`: fetch from the cache what they build.
      - name: Store paths needed by the offline NixOS evaluations of the tests
        run: nix eval --impure --json --expr "(import $PWD/tests/verif/g5_probe.nix { root = \"$PWD\"; }).report" > /dev/null
      - name: Every check of the project, in the development shell
        run: nix develop -c just test

  nix:
    name: NixOS modules and virtual machine tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Give the runner access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Flake checks (evaluation and virtual machines)
        run: nix flake check -L
