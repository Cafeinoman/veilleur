[project]
name = "veilleur-receive"
version = "0.0.0"
description = "Reference receiver for Veilleur: fetches, checks and files sealed reports."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["veilleur-protocol"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
veilleur-receive = "veilleur_receive.cli:main"

[tool.uv.sources]
veilleur-protocol = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veilleur_receive"]
