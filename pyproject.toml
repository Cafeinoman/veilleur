[project]
name = "veilleur"
version = "0.1.0"
description = "Self-hosted watch server: pluggable collectors, signed and encrypted reports."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "google-re2>=1.1.20251105",
    "veilleur-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
veilleur = "veilleur.apps.server.cli:main"

[project.entry-points."veilleur.collectors"]
rss = "veilleur.adapters.collectors.rss:RssCollector"
json_api = "veilleur.adapters.collectors.json_api:JsonApiCollector"
page = "veilleur.adapters.collectors.page:PageCollector"

[project.entry-points."veilleur.filters"]
keywords = "veilleur.adapters.filters.keywords:KeywordsFilter"
regex = "veilleur.adapters.filters.regex:RegexFilter"
dedup = "veilleur.adapters.filters.dedup:DedupFilter"

[project.entry-points."veilleur.renderers"]
markdown = "veilleur.adapters.renderers.markdown:MarkdownRenderer"
html = "veilleur.adapters.renderers.html:HtmlRenderer"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "babel>=2.16",
    # Independent check of the protocol test vectors (libsodium); never a run-time dependency.
    "pynacl>=1.5",
    # The end-to-end tests run the reference receiver against the server.
    "veilleur-receive",
]

[tool.uv.workspace]
members = ["protocol", "receiver"]

[tool.uv.sources]
veilleur-protocol = { workspace = true }
veilleur-receive = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veilleur"]

[tool.pytest.ini_options]
testpaths = ["tests", "protocol/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "protocol/src", "protocol/tests", "receiver/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests", "tools", "protocol/src", "protocol/tests", "receiver/src", "examples/veilleur-example-collector/src"]
strict = true
mypy_path = "src:protocol/src:receiver/src:examples/veilleur-example-collector/src"

[[tool.mypy.overrides]]
module = ["babel.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["veilleur", "veilleur_protocol", "veilleur_receive"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core depends on no adapter, application, storage, network, translation or cryptography"
type = "forbidden"
source_modules = ["veilleur.core"]
forbidden_modules = [
    "veilleur.adapters",
    "veilleur.apps",
    "veilleur.i18n",
    "veilleur_protocol",
    "sqlite3",
    "socket",
    "http",
    "urllib",
    "wsgiref",
]

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "veilleur.apps",
    "veilleur.adapters",
    "veilleur.core",
]

[[tool.importlinter.contracts]]
name = "The protocol library is standalone"
type = "forbidden"
source_modules = ["veilleur_protocol"]
forbidden_modules = ["veilleur", "veilleur_receive"]

[[tool.importlinter.contracts]]
name = "The reference receiver depends on the protocol library, never on the server"
type = "forbidden"
source_modules = ["veilleur_receive"]
forbidden_modules = ["veilleur"]
